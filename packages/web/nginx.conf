# Nginx che serve la build statica del client Vikiland dentro il container.
# Davanti c'è Traefik (TLS + routing): qui si parla solo HTTP sulla porta 80.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressione: i bundle JS/CSS di Vite sono grossi e comprimono bene.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/manifest+json;

  # Health check per Docker/Traefik (non passa dal service worker).
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Asset con hash nel nome: immutabili, cache lunghissima.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker e manifest della PWA: MAI in cache, altrimenti i client
  # restano inchiodati alla versione vecchia dopo un deploy.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Single-page app: ogni percorso sconosciuto torna all'index.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
